name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11.9.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Format check
        run: pnpm format:check

      - name: No raw hex colours or emojis
        run: pnpm check:tokens

      - name: Lint
        run: pnpm turbo run lint

      - name: Typecheck
        run: pnpm turbo run typecheck

      - name: Test
        run: pnpm turbo run test

      - name: Test coverage (logic packages gated at 80%, apps reported only)
        run: pnpm turbo run test:coverage

      - name: Build
        run: pnpm turbo run build
        env:
          # Publishable, not secret (AGENTS.md: only the service-role
          # key must never reach a client) - needed because Expo's
          # static web export eagerly evaluates every route's module
          # graph at build time, including supabase-client.ts's
          # module-scope createClient() call, for any route it turns
          # into a dynamic SSR function (first hit by Part 12's
          # apps/mobile/case/[id] - the first dynamic mobile route).
          # Next.js defers that same evaluation to request time, which
          # is why apps/web's build never needed this.
          EXPO_PUBLIC_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          EXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}

      - name: Install Playwright browser
        run: pnpm --filter @rescue-alert/web exec playwright install --with-deps chromium

      - name: Web E2E (public pages only - Part 19)
        run: pnpm --filter @rescue-alert/web test:e2e
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}

  sql:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgis/postgis:17-3.5
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGHOST: localhost
      PGUSER: postgres
      PGPASSWORD: postgres
    steps:
      - uses: actions/checkout@v4

      - name: Migrations and SQL tests
        run: bash supabase/tests/run.sh
